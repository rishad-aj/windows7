name: Build Aero7_Launcher APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'Aero7_Launcher.apk'
      - 'release-assets/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Restore Permanent Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "" | base64 -d > debug.keystore
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Setup Environment Variables
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        id: build_apk
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-assets
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" release-assets/Aero7_Launcher.apk
            cp "$APK_FILE" Aero7_Launcher.apk
            echo "Successfully prepared Aero7_Launcher.apk from $APK_FILE"
          else
            echo "Error: No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: Add APK File Directly to GitHub Repository
        if: always() && steps.build_apk.outcome == 'success'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Aero7_Launcher.apk
          git diff --staged --quiet || git commit -m "Update compiled Aero7_Launcher.apk (v1.0.${{ github.run_number }}) [skip ci]"
          git push

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: always() && steps.build_apk.outcome == 'success'
        with:
          tag_name: latest
          name: "Aero7 Windows 7 Launcher Latest Build (Aero7_Launcher.apk)"
          body: |
            ### 🪟 Aero7 Windows 7 Launcher Android APK
            - **Direct Download**: Download `Aero7_Launcher.apk` below directly to your phone.
            - **In-Place Update Ready**: Signed with the permanent keystore and auto-incremented `versionCode` (`#${{ github.run_number }}`) so you can install updates directly without uninstalling.
            - **Commit**: `${{ github.sha }}`
            - **Build Date**: `${{ github.event.head_commit.timestamp || 'Latest' }}`
          prerelease: false
          make_latest: true
          files: release-assets/Aero7_Launcher.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact (Optional Fallback)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Aero7_Launcher
          path: release-assets/Aero7_Launcher.apk
          retention-days: 1
